<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191C">
<meta name="description" content="신호등으로 보는 하루 루틴·투두·스케줄 플래너">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="하루틴">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>하루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Orbit&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column, sticky header with week strip and a yellow lane line, bottom tab bar. Theme: night road — asphalt, lane yellow, pedestrian signal */
  --bg:#17191C;
  --surface:#22252A;
  --surface-2:#2B2F35;
  --ink:#F2F2F0;
  --muted:#9BA0A8;
  --line:#33373D;
  --accent:#FFD23F;
  --accent-ink:#17191C;
  --accent-soft:#3A3420;
  --go:#3CC673;
  --go-soft:#1C3326;
  --wait:#FF8A2B;
  --wait-soft:#3A2614;
  --stop:#F06A5F;
  --stop-soft:#3A1F1D;
  --off:#3A3F46;
  --vac:#7EA7EE;
  --housing:#0C0D0F;
  --font-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --radius:16px;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 2px 8px rgba(0,0,0,.25);
  color-scheme:dark;
}
html[data-skin="paper"]{--bg:#F4F1EA;--surface:#FFFDF8;--surface-2:#EFEADF;--ink:#2B2A26;--muted:#77736A;--line:#E3DDD0;--accent:#3E5C4A;--accent-ink:#FFFFFF;--accent-soft:#E2E9E1;--go:#2E9E5B;--go-soft:#DDF0E3;--wait:#E0761A;--wait-soft:#FBE8D6;--stop:#D24A3F;--stop-soft:#F7DEDA;--off:#CFC8BA;--vac:#5B8BD9;--housing:#2B2A26;--font-display:"Gowun Batang",serif;--font-body:"Gowun Dodum","Noto Sans KR",sans-serif;--ds:.86;--dw:700;--lane-display:none;--lamp-bg:rgba(255,255,255,.07);--lamp-off:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.05);color-scheme:light}
html[data-skin="diary"]{--bg:#FFF1F4;--surface:#FFFFFF;--surface-2:#FFF5F8;--ink:#4A3A44;--muted:#94808C;--line:#F6D5E0;--accent:#D9578F;--accent-ink:#FFFFFF;--accent-soft:#FBE1EC;--go:#33A86A;--go-soft:#DDF4E7;--wait:#EE8233;--wait-soft:#FDEADB;--stop:#E2546A;--stop-soft:#FCE0E4;--off:#E8CFD8;--vac:#6D93D9;--housing:#4A3A44;--font-display:"Jua",sans-serif;--font-body:"Gaegu","Noto Sans KR",sans-serif;--body-size:17px;--ds:1;--dw:400;--radius:22px;--lane-display:none;--lamp-bg:rgba(255,255,255,.08);--lamp-off:rgba(255,255,255,.18);--shadow:0 2px 0 #F6D5E0;color-scheme:light}
html[data-skin="mono"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F4F4;--ink:#111111;--muted:#7E7E7E;--line:#E2E2E2;--accent:#111111;--accent-ink:#FFFFFF;--accent-soft:#EEEEEE;--go:#1E9E57;--go-soft:#E3F5EA;--wait:#EE7F1C;--wait-soft:#FDEBDB;--stop:#E0443A;--stop-soft:#FBE1DF;--off:#D4D4D4;--vac:#5B8BD9;--housing:#111111;--font-display:"Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",sans-serif;--ds:.8;--dw:700;--radius:8px;--lane-display:none;--lamp-bg:rgba(255,255,255,.07);--lamp-off:rgba(255,255,255,.16);--shadow:0 0 0 1px #E2E2E2;color-scheme:light}
html[data-skin="planner"]{--bg:#FBF7E9;--surface:#FFFDF2;--surface-2:#F5EED6;--ink:#33415C;--muted:#77819A;--line:#E9E1C4;--accent:#4F7CAC;--accent-ink:#FFFFFF;--accent-soft:#E3ECF6;--go:#3A9D63;--go-soft:#DFF1E5;--wait:#E5832A;--wait-soft:#FBEAD9;--stop:#D65547;--stop-soft:#F8E0DC;--off:#DCD3B4;--vac:#5B8BD9;--housing:#33415C;--font-display:"Nanum Pen Script",cursive;--font-body:"Gowun Dodum","Noto Sans KR",sans-serif;--ds:1.35;--dw:400;--radius:6px;--lane-display:block;--lane-color:#E9E1C4;--lamp-bg:rgba(255,255,255,.08);--lamp-off:rgba(255,255,255,.18);--shadow:0 1px 0 #E9E1C4,0 3px 10px rgba(51,65,92,.06);color-scheme:light}
html[data-skin="zebra"]{--bg:#2A2D31;--surface:#33373C;--surface-2:#3F444A;--ink:#F2F2F0;--muted:#A3A8AF;--line:#474C53;--accent:#F2F2F0;--accent-ink:#2A2D31;--accent-soft:#4A4E55;--housing:#16181B;--lane-color:#F2F2F0;--shadow:none;color-scheme:dark}
html[data-skin="dash"]{--bg:#0B0C0E;--surface:#15171A;--surface-2:#1E2125;--ink:#E8E8E8;--muted:#8D939B;--line:#262A2F;--accent:#4FD1FF;--accent-ink:#0B0C0E;--accent-soft:#10303B;--housing:#000000;--font-display:"Orbit","Noto Sans KR",sans-serif;--ds:.8;--lane-display:none;--shadow:0 0 0 1px #1E2125;color-scheme:dark}
html[data-skin="zebra"] .group{gap:6px}
html[data-skin="zebra"] .r{border-radius:4px;border-left:0;box-shadow:none;background:#3F444A}
html[data-skin="zebra"] .r .ic{background:rgba(255,255,255,.06)}
html[data-skin="zebra"] .r.done{background:#ECECEA}
html[data-skin="zebra"] .r.done .t{color:#2A2D31}
html[data-skin="zebra"] .r.done .sub{color:#5A5E64}
html[data-skin="zebra"] .r.done .ic{background:rgba(0,0,0,.06)}
html[data-skin="zebra"] .r.done .check.on{background:#DDEFE3}
html[data-skin="zebra"] .grp{background:transparent;box-shadow:none;border-left:0;padding:0;gap:6px}
html[data-skin="zebra"] .grp-h{padding:2px 2px}
.zebra{display:flex;gap:5px;margin-top:12px}
.zs{flex:1;height:16px;border-radius:2px;background:var(--surface-2)}
.zs.on{background:#F2F2F0}
.dashc .sig-msg,.dashc .sig-sub{text-align:center}
.gauge{width:100%;max-width:300px;display:block;margin:0 auto}
.gauge .gt{fill:var(--muted);font-size:9px;font-family:var(--font-display)}
.dash-read{display:flex;justify-content:center;margin-top:-6px}
.pct.go{color:var(--go)}.pct.wait{color:var(--wait)}.pct.stop{color:var(--stop)}
.dash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:92px}
.wt .wi{font-size:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.wt.todo .wi{background:var(--wait-soft);box-shadow:0 0 0 2px var(--wait),0 0 14px rgba(255,138,43,.35)}
.wt.done .wi{background:var(--go-soft);box-shadow:0 0 0 2px var(--go)}
.wt.idle{opacity:.45}
.wt .wn{font-size:11px;line-height:1.3;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.wt .wc{position:absolute;top:5px;right:6px;font-size:9px;font-weight:700;color:var(--accent)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skin{border-radius:14px;padding:10px 12px;text-align:left;border:2px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:76px}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.skin b{font-size:17px;font-weight:400;line-height:1.2}
.skin small{font-size:11px;opacity:.75;font-family:"Noto Sans KR",sans-serif}
.sk-dots{display:flex;gap:4px}
.sk-dots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(128,128,128,.45)}
.plant{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left}
.plant svg{width:88px;height:88px;flex:none;overflow:visible}
.plant .pi{flex:1;min-width:0}
.plant .pn{font-family:var(--font-display);font-weight:var(--dw,400);font-size:calc(19px * var(--ds,1));line-height:1.2}
.plant .pst{font-size:13px;font-weight:600;color:var(--go)}
.plant .ps{font-size:12px;color:var(--muted);margin-top:2px;word-break:keep-all}
.pbar{height:6px;border-radius:9px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--go);border-radius:9px}
@keyframes grow{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
svg.grew{animation:grow .8s ease-out;transform-origin:50% 100%}
.pstages{display:flex;flex-direction:column;gap:6px}
.pstage{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:var(--surface-2)}
.pstage svg{width:44px;height:44px;flex:none}
.pstage.lock{opacity:.45}
.pstage.cur{outline:2px solid var(--go)}
.pstage b{flex:1;font-weight:600;font-size:14px}
.pstage span{font-size:12px;color:var(--muted)}
.pbig{display:flex;justify-content:center}
.pbig svg{width:180px;height:180px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--body-size,15px);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid transparent}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:var(--dw,400);font-size:calc(28px * var(--ds,1));color:var(--accent);letter-spacing:.5px;line-height:1.1}
.lane{display:var(--lane-display,block);height:0;border-top:2px dashed var(--lane-color,var(--accent));opacity:.5;margin:10px 2px 0}
.date{font-size:13px;color:var(--muted);font-weight:500}
.hb{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink);position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.sync{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--off);border:2px solid var(--bg)}
.sync.on{background:var(--go)}
.pill{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.week{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:4px;margin-top:12px;align-items:center}
.wk-nav{height:52px;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.wk-nav svg{width:16px;height:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:14px;font-size:12px;color:var(--muted)}
.wd b{font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.wd .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
.wd.sel{background:var(--accent);color:var(--accent-ink)}
.wd.sel b{color:var(--accent-ink)}
.wd.today:not(.sel) b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.dot.go{background:var(--go)}.dot.wait{background:var(--wait)}.dot.stop{background:var(--stop)}.dot.vac{background:var(--vac)}.dot.off{background:var(--off);opacity:.5}
main{flex:1;padding:6px 16px 104px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px 0}
.sec-h h2{font-family:var(--font-display);font-size:calc(19px * var(--ds,1));font-weight:var(--dw,400);letter-spacing:.3px}
.sec-h .meta{font-size:12px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:13px}

/* signal */
.signal{display:flex;flex-direction:column;gap:10px}
.sig-top{display:flex;align-items:center;gap:14px}
.housing{background:var(--housing);border-radius:16px;padding:6px;display:inline-flex;gap:6px;flex:none}
.lamp{width:44px;height:44px;border-radius:11px;background:var(--lamp-bg,#1E2125);display:grid;place-items:center;transition:background .3s}
.lamp svg{width:32px;height:32px}
.lamp .fg{fill:var(--lamp-off,#383D44);stroke:var(--lamp-off,#383D44);transition:fill .3s,stroke .3s}
.lamp.stop.on{background:rgba(242,90,80,.2)}.lamp.stop.on .fg{fill:#F25A50;stroke:#F25A50}
.lamp.wait.on{background:rgba(255,138,43,.2)}.lamp.wait.on .fg{fill:#FF8A2B;stroke:#FF8A2B}
.lamp.go.on{background:rgba(55,207,120,.2)}.lamp.go.on .fg{fill:#37CF78;stroke:#37CF78}
.housing.vac .lamp{background:#1F2B3D}.housing.vac .lamp .fg{fill:#3E5A86;stroke:#3E5A86}
.pct{font-family:var(--font-display);font-weight:var(--dw,400);font-size:calc(48px * var(--ds,1));line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:20px;margin-left:2px;color:var(--muted)}
.sig-msg{font-weight:600;margin-top:6px}
.sig-sub{font-size:13px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);margin-top:10px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--off);transition:width .35s}
.meter i.go{background:var(--go)}.meter i.wait{background:var(--wait)}.meter i.stop{background:var(--stop)}
.meter .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.25}
.modes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed}
.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--stop)}
.btn.armed{background:var(--stop);color:#fff;border-color:var(--stop)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}

/* routine rows */
.group{display:flex;flex-direction:column;gap:8px}
.r{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border-left:4px solid transparent}
.r.done{border-left-color:var(--go)}
.r.rest{opacity:.6}
.grp{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 4px 4px;border-left:4px solid transparent;display:flex;flex-direction:column}
.grp.done{border-left-color:var(--go)}
.grp .r{box-shadow:none;border-left:0;padding:8px 8px}
.grp-h{display:flex;align-items:center;gap:8px;padding:4px 10px 2px;font-size:14px}
.grp-h .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
.r .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.ci{display:inline-grid;width:1.2em;height:1.2em;vertical-align:-.22em}
.ci svg{width:100%;height:100%}
.r .ic .ci{width:28px;height:28px}
.r .nm{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.r .t{font-weight:600;overflow-wrap:anywhere}
.r.done .t{color:var(--muted)}
.r .sub{font-size:12px;color:var(--muted)}
.alt{flex:none;font-size:12px;font-weight:600;color:var(--accent);padding:5px 8px;border-radius:8px;background:var(--accent-soft)}
.check{flex:none;width:42px;height:42px;border-radius:50%;border:2px dashed var(--off);display:grid;place-items:center;font-size:22px;transition:transform .15s}
.check:active{transform:scale(.92)}
.check.on{border:2px solid var(--go);background:var(--go-soft)}
.check.rest{border:2px solid var(--line);font-size:11px;color:var(--muted);font-weight:600}
.ord{display:flex;gap:4px}
.ord button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.ord svg{width:16px;height:16px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}

/* todo */
.add-row{display:flex;gap:8px}
.add-row .btn,.lrow .btn{white-space:nowrap;flex:none}
.field{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea.field{resize:vertical;min-height:72px}
select.field{width:auto}
.td{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--off);display:grid;place-items:center;color:var(--accent-ink)}
.cb.on{background:var(--go);border-color:var(--go)}
.cb svg{width:14px;height:14px}
.td .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.td.done .tt{color:var(--muted);text-decoration:line-through}
.cat{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff}
.more{flex:none;width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.more svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.progress-line{font-size:13px;color:var(--muted)}

/* schedule */
.tl{position:relative;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding-left:10px;font-variant-numeric:tabular-nums}
.tl .blk{position:absolute;border-radius:10px;padding:5px 8px;font-size:12px;color:#fff;overflow:hidden;text-align:left;line-height:1.3}
.tl .blk b{display:block;font-size:13px}
.tl .now{position:absolute;left:44px;right:0;border-top:2px solid var(--stop);z-index:2}
.tl .now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--stop)}

/* journal */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:14px;border:1px solid var(--line);font-size:24px}
.mood span{font-size:11px;color:var(--muted)}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-size:13px;font-weight:600}
.inline{display:flex;align-items:center;gap:8px}
.inline .field{width:110px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:var(--dw,400);font-size:calc(30px * var(--ds,1));line-height:1.2;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);margin-left:2px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav .lbl{font-weight:700}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
svg.chart .lab{fill:var(--ink);font-weight:600}
.f-go{fill:var(--go)}.f-wait{fill:var(--wait)}.f-stop{fill:var(--stop)}.f-off{fill:var(--off)}.f-vac{fill:var(--vac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-variant-numeric:tabular-nums}
.cal .c i{width:16px;height:16px;border-radius:50%;background:var(--surface-2)}
.cal .c.go i{background:var(--go)}.cal .c.wait i{background:var(--wait)}.cal .c.stop i{background:var(--stop)}.cal .c.vac i{background:var(--vac)}
.cal .c.today{outline:2px solid var(--accent);outline-offset:-2px}
.rb{display:grid;grid-template-columns:1fr 54px;gap:4px 10px;align-items:center;font-size:13px}
.rb .bar{height:8px;border-radius:99px;background:var(--surface-2);grid-column:1/-1;overflow:hidden;display:block}
.rb .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rbs{display:flex;flex-direction:column;gap:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--surface-2);font-size:12px}
.badge .e{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--wait)}
.badge.lock{color:var(--muted)}
.badge.lock .e{filter:grayscale(1);opacity:.45;border-color:var(--line)}
.badge b{font-size:12px}

nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;max-height:88%;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:21;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-h h2{font-family:var(--font-display);font-size:calc(22px * var(--ds,1));font-weight:var(--dw,400)}
.sh-b{display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.fl>.lbl{font-size:13px;font-weight:600}
.fl .hint{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt>span{display:grid;place-items:center;min-width:40px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;background:var(--surface)}
.opt.emo>span{font-size:20px;padding:0;width:42px}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emogrid button{aspect-ratio:1;border-radius:14px;background:var(--surface-2);font-size:24px}
.emogrid button.on{outline:2px solid var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:8px}
.lrow .field{flex:1}
.tpl{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tpl h3{font-size:15px}
.tpl .opts .opt>span{display:flex;align-items:center;gap:6px;height:auto;padding:7px 10px;font-weight:500;justify-content:start}
.swatches{display:flex;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{display:block;width:30px;height:30px;border-radius:50%}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.toggle{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--off);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .2s}
.switch.on{background:var(--go)}
.switch.on::after{left:21px}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const skinOf=()=>SKINS.some(x=>x.id===state.settings.skin)?state.settings.skin:'night';
function applySkin(){const id=skinOf(),sk=SKINS.find(x=>x.id===id);document.documentElement.dataset.skin=id;const m=document.querySelector('meta[name="theme-color"]');if(m) m.setAttribute('content',sk.bg)}
const TABS=[['today','루틴'],['todo','투두'],['schedule','스케줄'],['journal','기록'],['stats','통계']];

/* ---------- state ---------- */
const LS='harutin-state-v1';
function seed(){
  const t=todayKey(),m1=uid(),m2=uid(),all=[0,1,2,3,4,5,6],wk=[1,2,3,4,5];
  const R=(name,emoji,slot,days,alts,modeId)=>({id:uid(),modeId:modeId||m1,name,emoji,slot,days:days||all,alts:alts||[]});
  const c1=uid(),c2=uid(),c3=uid();
  return {v:1,updatedAt:0,startedAt:t,
    modes:[{id:m1,name:'기본'},{id:m2,name:'주말 느슨하게'}],activeMode:m1,
    routines:[R('일어나서 물 한 잔','💧','morning'),R('이불 정리하기','🛏️','morning'),R('스트레칭 5분','🧘','morning',all,['요가 10분','폼롤러 5분']),
      R('점심 후 산책 15분','🌿','afternoon',wk),R('영양제 챙기기','💊','anytime'),R('책 10쪽 읽기','📖','evening',all,['오디오북 15분']),R('내일 할 일 3개 적기','📝','evening'),
      R('늦잠 OK, 물 한 잔','💧','morning',all,[],m2),R('밀린 빨래·청소','🧹','afternoon',all,[],m2),R('좋아하는 영화 한 편','🎧','evening',all,[],m2)],
    categories:[{id:c1,name:'업무',color:'#3B6FD8'},{id:c2,name:'개인',color:'#22A157'},{id:c3,name:'공부',color:'#8A5CD0'}],
    todos:[{id:uid(),title:'강의 자료 마무리',date:t,catId:c1,done:false},{id:uid(),title:'장보기 목록 정리',date:t,catId:c2,done:true},{id:uid(),title:'논문 2편 읽기',date:t,catId:c3,done:false},{id:uid(),title:'가을 옷 정리하기',date:null,catId:c2,done:false}],
    schedules:[{id:uid(),date:t,start:'09:30',end:'11:00',title:'오전 집중 작업',color:'#3B6FD8'},{id:uid(),date:t,start:'12:30',end:'13:30',title:'점심 약속',color:'#22A157'},{id:uid(),date:t,start:'19:00',end:'20:00',title:'운동',color:'#E3A118'}],
    days:{},vacations:[],
    settings:{greenAt:60,doneToBottom:true,lastEmoji:'😊'},
    flags:{example:true}
  };
}
function migrate(o){
  const s=seed();
  if(!o||typeof o!=='object') return s;
  o.v=1;
  o.modes=Array.isArray(o.modes)&&o.modes.length?o.modes:[{id:uid(),name:'기본'}];
  if(!o.modes.some(m=>m.id===o.activeMode)) o.activeMode=o.modes[0].id;
  ['routines','categories','todos','schedules','vacations'].forEach(k=>{if(!Array.isArray(o[k])) o[k]=[]});
  o.routines.forEach(r=>{r.days=Array.isArray(r.days)?r.days:[0,1,2,3,4,5,6];r.alts=Array.isArray(r.alts)?r.alts:[];r.slot=r.slot||'anytime';r.emoji=r.emoji||'🌱'});
  o.days=o.days&&typeof o.days==='object'?o.days:{};
  o.settings=Object.assign({},s.settings,o.settings||{});
  o.flags=Object.assign({},o.flags||{});
  o.startedAt=o.startedAt||todayKey();
  o.updatedAt=o.updatedAt||0;
  return o;
}
let state=seed();
const ui={tab:'today',sel:todayKey(),order:false,drawer:false,catFilter:'all',statView:'month',statAnchor:todayKey()};
const remote={ref:null,status:'local',err:''};

function loadLocal(){try{const s=localStorage.getItem(LS);if(s) return JSON.parse(s)}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
let saveTimer=null,saving=false,again=false;
function scheduleRemote(){if(!remote.ref) return;clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,700)}
async function pushRemote(){
  if(!remote.ref) return;
  if(saving){again=true;return}
  saving=true;
  try{await remote.ref.set({json:JSON.stringify(state),updatedAt:state.updatedAt});remote.status='cloud';remote.err=''}
  catch(e){remote.status='error';remote.err=String((e&&e.message)||e)}
  saving=false;renderSyncDot();
  if(again){again=false;pushRemote()}
}
function readSnap(s){
  if(!s) return null;
  if(typeof s.data==='function'){if(s.exists===false) return null;return s.data()||null}
  if(s.data&&typeof s.data==='object') return s.data;
  return s;
}
async function initRemote(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){remote.status='local';return}
  let finished=false;
  const timer=setTimeout(()=>{if(!finished){remote.status='local';renderSyncDot()}},10000);
  try{
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user){finished=true;clearTimeout(timer);remote.status='local';renderSyncDot();return}
    const id=await user.id();
    const ref=db.collection('data/users/'+id).doc('state');
    const data=readSnap(await ref.get());
    finished=true;clearTimeout(timer);
    remote.ref=ref;remote.status='cloud';
    if(data&&data.json){
      let r=null;try{r=JSON.parse(data.json)}catch(e){}
      if(r&&(r.updatedAt||0)>=(state.updatedAt||0)){state=migrate(r);if(applyChoice()){commit()}else{saveLocal();render()}}
      else pushRemote();
    }else if(state.updatedAt){pushRemote()}
    renderSyncDot();
  }catch(e){finished=true;clearTimeout(timer);remote.status='error';remote.err=String((e&&e.message)||e);renderSyncDot()}
}
function commit(opts){
  state.updatedAt=Date.now();
  saveLocal();scheduleRemote();
  if(!opts||opts.render!==false) render();
}

function applyChoice(){
  if(state.flags['choice-ex-v1']) return false;
  const pick=re=>state.routines.find(x=>x.modeId===state.activeMode&&re.test(x.name))||state.routines.find(x=>re.test(x.name));
  const p=pick(/철봉/),r=pick(/(^|[^매])달리기|러닝|조깅/);
  if(p&&r){p.choice='운동';r.choice='운동';Object.keys(state.days).forEach(k=>{if(Array.isArray(state.days[k].only)) snapshot(k)});snapshot(todayKey())}
  state.flags['choice-ex-v1']=true;return true;
}

/* ---------- domain ---------- */
function day(k,create){
  let d=state.days[k];
  if(!d){if(!create) return null;d=state.days[k]={}}
  d.checks=d.checks||{};d.rest=d.rest||{};d.alt=d.alt||{};
  return d;
}
function routinesFor(k){const d=state.days[k];if(d&&Array.isArray(d.only)) return state.routines.filter(r=>d.only.includes(r.id));const wd=parseKey(k).getDay();return state.routines.filter(r=>r.modeId===state.activeMode&&r.days.includes(wd))}
function onVacation(k){return state.vacations.some(v=>k>=v.from&&k<=v.to)}
function units(rs,d){
  d=d||{};const rest=d.rest||{},checks=d.checks||{},map=new Map();
  rs.forEach(r=>{const key=r.choice?'c:'+r.choice:r.id;if(!map.has(key)) map.set(key,[]);map.get(key).push(r)});
  let total=0,done=0;
  map.forEach(ms=>{const act=ms.filter(r=>!rest[r.id]);if(!act.length) return;total++;if(act.some(r=>checks[r.id])) done++});
  return {total,done};
}
function liveRate(k){const rs=routinesFor(k),u=units(rs,state.days[k]);return {total:u.total,done:u.done,all:rs.length}}
function snapshot(k){const d=day(k,true);const l=liveRate(k);d.total=l.total;d.done=l.done}
function rateOf(k){
  const T=todayKey();
  if(k>T) return null;
  if(onVacation(k)) return 'vac';
  const d=state.days[k];
  if(k!==T&&d&&typeof d.total==='number') return d.total?d.done/d.total:null;
  if(k===T||k>=state.startedAt){const l=liveRate(k);return l.total?l.done/l.total:null}
  return null;
}
function level(r){
  if(r===null||r===undefined) return 'off';
  if(r==='vac') return 'vac';
  if(r>=state.settings.greenAt/100-1e-9) return 'go';
  if(r>=0.3) return 'wait';
  return 'stop';
}
function daysLabel(days){
  const s=[...days].sort().join(',');
  if(days.length===7) return '매일';
  if(s==='1,2,3,4,5') return '평일';
  if(s==='0,6') return '주말';
  return MON_FIRST.filter(d=>days.includes(d)).map(d=>WD[d]).join(' ');
}
function fmtLong(k){const d=parseKey(k);return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`}
function fmtShort(k){const d=parseKey(k);return `${d.getMonth()+1}.${d.getDate()}`}
function routineName(r,k){const d=state.days[k];const i=d&&d.alt?d.alt[r.id]||0:0;return i&&r.alts[i-1]?r.alts[i-1]:r.name}
function firstDay(){let f=state.startedAt;Object.keys(state.days).forEach(k=>{if(k<f) f=k});return f}
function streaks(){
  const T=todayKey(),F=firstDay();let cur=0,k=T,guard=0;
  if(level(rateOf(T))!=='go') k=addDays(T,-1);
  while(k>=F&&guard++<4000){const lv=level(rateOf(k));if(lv==='go') cur++;else if(lv!=='vac') break;k=addDays(k,-1)}
  let best=0,run=0;guard=0;
  for(let x=F;x<=T&&guard++<4000;x=addDays(x,1)){const lv=level(rateOf(x));if(lv==='go'){run++;if(run>best) best=run}else if(lv!=='vac') run=0}
  return {cur,best:Math.max(best,cur)};
}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(){
  applySkin();
  const T=todayKey();
  app.innerHTML=header(T)+`<main id="main">${({today:viewToday,todo:viewTodo,schedule:viewSchedule,journal:viewJournal,stats:viewStats}[ui.tab]||viewToday)()}</main>`+nav();
}
function renderSyncDot(){const el=document.querySelector('.sync');if(el){el.classList.toggle('on',remote.status==='cloud');el.title=syncText()}}
function syncText(){return '이 휴대폰에 저장돼요. 기기를 바꾸거나 앱을 지우기 전에 백업 파일을 저장해 두세요'}
function header(T){

  <div class="hb">${ui.sel!==T&&ui.tab!=='stats'?'<button class="pill" data-a="go-today">오늘로</button>':''}

}
function weekStrip(T){
  const d=parseKey(ui.sel),off=(d.getDay()+6)%7,start=addDays(ui.sel,-off);
  let h=`<div class="week"><button class="wk-nav" data-a="wk" data-id="-7" aria-label="지난주">${SVG.l}</button>`;
  for(let i=0;i<7;i++){
    const k=addDays(start,i),dd=parseKey(k);
    h+=`<button class="wd ${k===ui.sel?'sel':''} ${k===T?'today':''}" data-a="sel" data-id="${k}" aria-label="${fmtLong(k)}"><span>${WD[dd.getDay()]}</span><b>${dd.getDate()}</b><span class="dot ${level(rateOf(k))}"></span></button>`;
  }
  return h+`<button class="wk-nav" data-a="wk" data-id="7" aria-label="다음 주">${SVG.r}</button></div>`;
}
function nav(){return `<nav class="tabs">${TABS.map(([id,n])=>`<button class="tab ${ui.tab===id?'on':''}" data-a="tab" data-id="${id}" aria-current="${ui.tab===id?'page':'false'}">${SVG[id]}${n}</button>`).join('')}</nav>`}

function gauge(pct,show,g){
  const cx=110,cy=112,R=88,P=a=>{const t=Math.PI*(1-a/100);return [cx+R*Math.cos(t),cy-R*Math.sin(t)]};
  const arc=(a,b,c)=>{const p=P(a),q=P(b);return `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} A${R} ${R} 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" fill="none" stroke="${c}" stroke-width="12"/>`};
  let s=`<svg class="gauge" viewBox="0 0 220 124" role="img" aria-label="달성률 계기판 ${show?pct+'%':''}">`+arc(0,29.4,'var(--stop)')+arc(30.6,g-0.6,'var(--wait)')+arc(g+0.6,100,'var(--go)');
  for(let i=0;i<=100;i+=10){const t=Math.PI*(1-i/100),c=Math.cos(t),n=Math.sin(t);s+=`<line x1="${(cx+(R-12)*c).toFixed(1)}" y1="${(cy-(R-12)*n).toFixed(1)}" x2="${(cx+(R-(i%50?17:22))*c).toFixed(1)}" y2="${(cy-(R-(i%50?17:22))*n).toFixed(1)}" stroke="var(--muted)" stroke-width="${i%50?1.2:2}"/>`;if(i%50===0) s+=`<text class="gt" x="${(cx+(R-32)*c).toFixed(1)}" y="${(cy-(R-32)*n+3).toFixed(1)}" text-anchor="middle">${i}</text>`}
  const t=Math.PI*(1-(show?pct:0)/100);
  s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+(R-26)*Math.cos(t)).toFixed(1)}" y2="${(cy-(R-26)*Math.sin(t)).toFixed(1)}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/>`;
  return s+`</svg>`;
}
function viewToday(){
  const k=ui.sel,T=todayKey(),vac=onVacation(k),future=k>T;
  const rs=routinesFor(k),d=state.days[k]||{checks:{},rest:{},alt:{}};
  const live=liveRate(k),r=rateOf(k),lv=level(r),g=state.settings.greenAt;
  const pct=live.total?Math.round(live.done/live.total*100):0;
  const need=Math.max(0,Math.ceil(live.total*g/100-1e-9)-live.done);
  let msg,sub;
  if(vac){msg='휴가 중이에요';sub='이 기간에는 루틴 체크가 면제돼요'}
  else if(d.only&&live.total){const n=d.only.filter(id=>d.checks&&d.checks[id]).length;msg=n>1?'철봉·달리기 모두 했어요':n?'운동 완료':'운동 기록 없음';sub='가져온 운동 기록이에요 · 둘 중 하나만 해도 완료'}
  else if(!live.all){msg='예정된 루틴이 없어요';sub='아래에서 루틴을 추가해 보세요'}
  else if(!live.total){msg='오늘은 모두 쉬어가요';sub='쉬어가기로 한 루틴은 달성률에서 빠져요'}
  else if(future){msg='아직 오지 않은 날이에요';sub=`${live.total}개 루틴이 예정돼 있어요`}
  else if(lv==='go'){msg=live.done===live.total?'모든 루틴을 끝냈어요':'초록불이 켜졌어요';sub=`${live.total}개 중 ${live.done}개 완료 · 완벽하지 않아도 충분해요`}
  else{msg=`초록불까지 ${need}개 남았어요`;sub=`${live.total}개 중 ${live.done}개 완료 · ${g}%면 초록불`}
  const lampOn=x=>(!vac&&!future&&live.total&&lv===x)?'on':'';
  const lamp=x=>`<span class="lamp ${x} ${lampOn(x)}"><svg viewBox="0 0 24 24" aria-hidden="true">${PED[x]}</svg></span>`;
  const lampName={stop:'빨간불',wait:'주황불',go:'초록불'}[lv]||'꺼짐';
  const skin=skinOf(),showPct=!(vac||future||!live.total);
  let h;

    h=`<section class="card signal dashc" aria-label="오늘의 루틴 계기판">${gauge(pct,showPct,g)}

    <div><div class="sig-msg">${msg}</div><div class="sig-sub">${sub}</div></div></section>`;
  }else{
    const bar=skin==='zebra'&&live.total&&!vac?`<div class="zebra" role="img" aria-label="횡단보도 ${live.total}칸 중 ${live.done}칸">${Array.from({length:Math.min(live.total,14)},(_,i)=>`<span class="zs ${i<Math.round(live.done*Math.min(live.total,14)/live.total)?'on':''}"></span>`).join('')}</div>`
      :`<div class="meter"><i class="${future||vac?'':lv}" style="width:${vac||future?0:pct}%"></i><span class="mark" style="left:${g}%"></span></div>`;
    h=`<section class="card signal" aria-label="오늘의 루틴 신호등">
    <div class="sig-top"><div class="housing ${vac?'vac':''}" role="img" aria-label="${vac?'휴가':lampName}">${lamp('stop')}${lamp('wait')}${lamp('go')}</div>
    <div class="pct">${showPct?pct:'–'}<small>%</small></div></div>
    <div><div class="sig-msg">${msg}</div><div class="sig-sub">${sub}</div>${bar}</div></section>`;
  }
  if(state.settings.plant!==false) h+=plantCard();
  h+=`<div class="modes" role="tablist" aria-label="루틴 모드">${state.modes.map(m=>`<button class="chip ${m.id===state.activeMode?'on':''}" data-a="mode" data-id="${m.id}" role="tab" aria-selected="${m.id===state.activeMode}">${esc(m.name)}</button>`).join('')}${state.modes.length<10?'<button class="chip add" data-a="settings">+ 모드</button>':''}</div>`;
  if(state.flags.example) h+=`<div class="banner"><div><b>예시 루틴과 할 일이 들어 있어요.</b> 그대로 써도 되고, 추천 루틴에서 주제를 골라 새로 시작해도 돼요.</div><div class="row"><button class="btn sm primary" data-a="tpl">추천 루틴 보기</button><button class="btn sm" data-a="clear-example">예시 모두 지우기</button><button class="btn sm" data-a="keep-example">그대로 쓰기</button></div></div>`;
  if(!rs.length){
    h+=`<div class="card empty"><div>이 날은 예정된 루틴이 없어요.</div><div class="actions" style="width:100%"><button class="btn primary" data-a="r-new">루틴 추가</button><button class="btn" data-a="tpl">추천 루틴</button></div></div>`;
    return h;
  }
  if(skin==='dash'){
    const ord=[];SLOTS.forEach(([sid])=>rs.forEach(x=>{if(x.slot===sid) ord.push(x)}));
    h+=`<div class="sec-h"><h2>${k===T?'경고등':fmtShort(k)+' 경고등'}</h2><button class="link" data-a="order">${ui.order?'완료':'편집'}</button></div>`;
    h+=`<div class="note" style="margin:-6px 2px 0">${ui.order?'편집할 루틴을 누르세요':'주황 불이 켜진 루틴을 누르면 체크돼요'}</div><div class="dash-grid">`+ord.map(x=>{
      const em=d.checks&&d.checks[x.id],rest=d.rest&&d.rest[x.id],gd=x.choice&&!em&&rs.some(y=>y.choice===x.choice&&d.checks&&d.checks[y.id]);
      const st=em?'done':(rest||gd)?'idle':'todo',nm=routineName(x,k);
      return `<button class="wt ${st}" data-a="${ui.order?'r-edit':'check'}" data-id="${x.id}" aria-label="${esc(nm)} ${em?'완료':rest?'쉬어감':gd?'택1 완료':'아직 안 함'}"><span class="wi">${iconHtml(x.emoji)}</span><span class="wn">${esc(nm)}</span>${x.choice?'<span class="wc">택1</span>':''}</button>`;
    }).join('')+`</div>`;
    h+=`<div class="actions"><button class="btn" data-a="r-new">+ 루틴 추가</button><button class="btn" data-a="tpl">추천 루틴</button></div>`;
    return h;

  };

    });
    h+=`</div>`;
  });
  h+=`<div class="actions"><button class="btn" data-a="r-new">+ 루틴 추가</button><button class="btn" data-a="tpl">추천 루틴</button></div>`;

}

function viewSchedule(){
  const k=ui.sel,T=todayKey();
  const items=state.schedules.filter(s=>s.date===k).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const HH=52;
  let startH=6,endH=24;
  items.forEach(s=>{startH=Math.min(startH,Math.floor(toMin(s.start)/60))});
  const lanes=[];
  const placed=items.map(s=>{const st=toMin(s.start),en=Math.max(st+15,toMin(s.end));let li=lanes.findIndex(e=>e<=st);if(li<0){li=lanes.length;lanes.push(en)}else lanes[li]=en;return {s,st,en,li}});
  const nL=Math.max(1,lanes.length);
  let h=`<div class="sec-h"><h2>${fmtShort(k)} 스케줄</h2><button class="btn sm primary" data-a="sc-new">+ 일정 추가</button></div>`;
  if(!items.length) h+=`<div class="card empty">이 날의 일정이 없어요. 시간이 정해진 일을 추가하면 타임라인에 표시돼요.</div>`;
  h+=`<div class="tl" style="height:${(endH-startH)*HH+12}px">`;
  for(let i=startH;i<=endH;i++) h+=`<div class="hr" style="top:${(i-startH)*HH+6}px">${pad(i%24)}:00</div>`;
  placed.forEach(p=>{
    const top=(p.st/60-startH)*HH+6,hgt=Math.max(24,(p.en-p.st)/60*HH-3);
    const left=`calc(52px + (100% - 60px) * ${p.li/nL})`,w=`calc((100% - 60px) / ${nL} - 4px)`;
    h+=`<button class="blk" data-a="sc-edit" data-id="${p.s.id}" style="top:${top}px;height:${hgt}px;left:${left};width:${w};background:${p.s.color}"><b>${esc(p.s.title)}</b>${esc(p.s.start)}–${esc(p.s.end)}</button>`;
  });
  if(k===T){const now=new Date(),m=now.getHours()*60+now.getMinutes();if(m/60>=startH) h+=`<div class="now" style="top:${(m/60-startH)*HH+6}px" aria-label="현재 시각"></div>`}
  h+=`</div>`;
  return h;
}

function weekChart(rates,g){
  const W=320,H=170,pt=20,pb=28,bw=W/7,ch=H-pt-pb;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="요일별 달성률 막대 그래프">`;
  const gy=pt+ch*(1-g/100);
  s+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--go)" stroke-dasharray="3 4" opacity=".6"/><text x="${W-2}" y="${gy-4}" text-anchor="end">초록불 ${g}%</text>`;
  s+=`<line x1="0" x2="${W}" y1="${pt+ch}" y2="${pt+ch}" stroke="var(--line)"/>`;
  rates.forEach((x,i)=>{
    const lv=level(x.r),v=typeof x.r==='number'?x.r:(x.r==='vac'?1:0),bh=Math.max(lv==='off'?0:3,ch*v),bx=i*bw+bw*.22,bwid=bw*.56,by=pt+ch-bh;
    s+=`<rect x="${bx}" y="${by}" width="${bwid}" height="${bh}" rx="6" class="f-${lv}" ${lv==='vac'?'opacity=".35"':''}/>`;
    const lab=typeof x.r==='number'?Math.round(x.r*100)+'%':x.r==='vac'?'휴가':'';
    if(lab) s+=`<text x="${bx+bwid/2}" y="${by-5}" text-anchor="middle" class="lab">${lab}</text>`;
    const d=parseKey(x.k);
    s+=`<text x="${bx+bwid/2}" y="${H-12}" text-anchor="middle">${WD[d.getDay()]}</text><text x="${bx+bwid/2}" y="${H-1}" text-anchor="middle">${d.getDate()}</text>`;
  });
  return s+`</svg>`;
}
function monthCal(ds,T){
  const off=(parseKey(ds[0]).getDay()+6)%7;
  let h=`<div class="cal">${MON_FIRST.map(d=>`<div class="h">${WD[d]}</div>`).join('')}`;
  for(let i=0;i<off;i++) h+=`<div></div>`;
  ds.forEach(k=>{const r=rateOf(k),lv=level(r);h+=`<button class="c ${lv} ${k===T?'today':''}" data-a="cal-go" data-id="${k}" aria-label="${fmtLong(k)} ${typeof r==='number'?Math.round(r*100)+'%':''}"><i></i>${parseKey(k).getDate()}</button>`});
  return h+`</div>`;
}
function lineChart(pts,n,o){
  const vals=pts.filter(p=>p.v!==null&&!isNaN(p.v));
  if(!vals.length) return `<div class="note">이 기간의 기록이 없어요. 기록 탭에서 입력할 수 있어요.</div>`;
  const W=320,H=120,pl=8,pr=8,pt=18,pb=18;
  let mn=o.min!=null?o.min:Math.min(...vals.map(p=>p.v)),mx=o.max!=null?o.max:Math.max(...vals.map(p=>p.v));
  if(mx===mn){mx+=1;mn-=1}
  const X=i=>pl+(n>1?i/(n-1):.5)*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=vals.map((p,j)=>`${j?'L':'M'}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=vals.length>1?`${line} L${X(vals[vals.length-1].i).toFixed(1)},${H-pb} L${X(vals[0].i).toFixed(1)},${H-pb} Z`:'';
  const last=vals[vals.length-1];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="추이 그래프">`;
  [mn,mx].forEach(v=>{s+=`<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl}" y="${Y(v)-4}">${o.fmt(v)}</text>`});
  if(area) s+=`<path d="${area}" fill="var(--accent)" opacity=".12"/>`;
  s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach(p=>{s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="2.6" fill="var(--accent)"/>`});
  s+=`<circle cx="${X(last.i)}" cy="${Y(last.v)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/><text x="${Math.min(X(last.i),W-40)}" y="${H-4}" class="lab">${o.fmt(last.v)}</text>`;
  return s+`</svg>`;
}
function badges(st){
  const all=Object.values(state.days);
  const checks=all.reduce((s,d)=>s+Object.keys(d.checks||{}).length,0);
  const retros=all.filter(d=>d.retro&&Object.values(d.retro).some(v=>v&&String(v).trim())).length;
  const doneTodos=state.todos.filter(t=>t.done).length;
  const greenDays=Object.keys(state.days).filter(k=>level(rateOf(k))==='go').length;
  const perfectMorning=Object.keys(state.days).some(k=>{const ms=routinesFor(k).filter(r=>r.slot==='morning');const d=state.days[k];const u=units(ms,d);return u.total&&u.done===u.total});
  return [
    {e:'🌱',n:'첫 체크',ok:checks>=1,p:'루틴 1개 체크'},
    {e:'🚦',n:'첫 초록불',ok:greenDays>=1,p:`하루 ${state.settings.greenAt}% 달성`},
    {e:'🌅',n:'완벽한 아침',ok:perfectMorning,p:'아침 루틴 모두 완료'},
    {e:'🔥',n:'3일 연속',ok:st.best>=3,p:`초록불 ${Math.min(st.best,3)}/3일`},
    {e:'🏅',n:'7일 연속',ok:st.best>=7,p:`초록불 ${Math.min(st.best,7)}/7일`},
    {e:'💯',n:'체크 100개',ok:checks>=100,p:`${Math.min(checks,100)}/100`},
    {e:'📔',n:'회고 7번',ok:retros>=7,p:`${Math.min(retros,7)}/7`},
    {e:'✅',n:'투두 30개',ok:doneTodos>=30,p:`${Math.min(doneTodos,30)}/30`},
    {e:'🏆',n:'30일 연속',ok:st.best>=30,p:`초록불 ${Math.min(st.best,30)}/30일`}
  ];
}

function openSheet(title,html){
  let root=document.getElementById('sheet-root');
  if(root&&root.dataset.title===title){const b=root.querySelector('.sh-b');const sc=root.querySelector('.sheet').scrollTop;b.innerHTML=html;root.querySelector('.sheet').scrollTop=sc;return}
  if(root) root.remove();
  root=document.createElement('div');root.id='sheet-root';root.dataset.title=title;
  root.innerHTML=`<div class="scrim" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh-h"><h2>${esc(title)}</h2><button class="icon-btn" data-a="sheet-close" aria-label="닫기">✕</button></div><div class="sh-b">${html}</div></div>`;
  document.body.appendChild(root);
  const f=root.querySelector('input:not([type=radio]):not([type=checkbox]),textarea');if(f&&f.dataset.autofocus!==undefined) f.focus();
}

function plantSVG(st,cls){

  const berry=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.2" fill="${C.red}"/><circle cx="${x-1}" cy="${y-1.1}" r="1" fill="#FFB3B5"/>`;
  const pot=(s=1)=>`<g transform="translate(60 118) scale(${s}) translate(-60 -118)"><ellipse cx="60" cy="118" rx="27" ry="2.6" fill="rgba(0,0,0,.18)"/><path d="M39 92H81L77 113Q76 116.5 72.5 116.5H47.5Q44 116.5 43 113Z" fill="#D9845A"/><path d="M41 98H79" stroke="#C4703F" stroke-width="1.6"/><rect x="34" y="84" width="52" height="10" rx="4" fill="#E89A6C"/><rect x="37.5" y="86" width="18" height="2.6" rx="1.3" fill="#F6BC95"/><ellipse cx="60" cy="86" rx="22" ry="3.4" fill="#5A3B26"/></g>`;
  const ground=()=>`<path d="M0 104Q30 98 60 101T120 100V120H0Z" fill="#7CC36B"/><path d="M0 110Q40 106 70 109T120 108V120H0Z" fill="#5FAE52"/>`;
  const tree=(x,b,s,o={})=>{
    let g=`<g transform="translate(${x} ${b}) scale(${s})">`;
    g+=`<path d="M-3 0C-2-14-3-26 0-40 3-26 2-14 3 0Z" fill="${C.trunk}"/><path d="M0-22L-10-31M1-28L10-36" stroke="${C.trunk}" stroke-width="3" stroke-linecap="round"/><path d="M1 0C2-14 1.5-26 0-40" stroke="${C.trunkD}" stroke-width="1.4" fill="none"/>`;
    g+=`<circle cx="0" cy="-50" r="19" fill="${C.d}"/><circle cx="-15" cy="-40" r="13" fill="${C.m}"/><circle cx="15" cy="-41" r="13" fill="${C.m}"/><circle cx="-6" cy="-60" r="13" fill="${C.m}"/><circle cx="9" cy="-58" r="12" fill="${C.l}"/><circle cx="-11" cy="-52" r="9" fill="${C.l}"/><circle cx="-4" cy="-64" r="5" fill="#8FDCA0"/>`;
    if(o.blossom) [[-14,-44],[-4,-58],[9,-62],[14,-46],[-17,-55],[3,-48],[19,-38],[-9,-36],[8,-38]].forEach(([a,c])=>{g+=`<circle cx="${a}" cy="${c}" r="3.4" fill="${C.pink}"/><circle cx="${a}" cy="${c}" r="1.3" fill="#FFF0F6"/>`});
    if(o.fruit) [[-13,-42],[6,-58],[14,-45],[-5,-50],[18,-36],[-18,-50],[2,-40]].slice(0,o.fruit).forEach(([a,c])=>{g+=berry(a,c)});
    if(o.bird) g+=`<g transform="translate(13 -33)"><path d="M-12 1H6" stroke="${C.trunkD}" stroke-width="2" stroke-linecap="round"/><ellipse cx="0" cy="-4" rx="5.5" ry="4.5" fill="#FFC93C"/><circle cx="3.6" cy="-7.4" r="3.4" fill="#FFC93C"/><path d="M6.6-7.6l3 1-3 1z" fill="#F08A24"/><circle cx="4.4" cy="-8.2" r=".9" fill="#2A2A2A"/><path d="M-5-4q-4 1-5-2" stroke="#E8A91F" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
    return g+`</g>`;
  };
  const bush=(o={})=>{let g=`<path d="M60 86Q58 72 50 60M60 86Q61 68 61 52M60 86Q63 72 71 60" stroke="${C.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    [[48,64,-175,.95,C.d],[73,62,-10,.95,C.d],[54,56,-140,.9,C.m],[66,55,-40,.9,C.m],[60,50,-95,.85,C.l],[50,60,150,.7,C.m],[71,59,30,.7,C.m],[47,70,-200,.75,C.l],[74,70,20,.75,C.l]].forEach(l=>{g+=leaf(...l)});

    case 4: g=pot()+`<path d="M60 86Q55 70 61 58T63 42" stroke="${C.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>`+leaf(58,78,-170,.7,C.d)+leaf(58,73,-12,.78,C.m)+leaf(59,64,-155,.85,C.m)+leaf(61,58,-25,.9,C.l)+leaf(62,50,-150,.78,C.l)+leaf(62.5,46,-40,.7,C.m)+leaf(63,43,-100,.5,C.l);break;
    case 5: g=pot()+bush();break;
    case 6: g=pot()+bush({buds:1});break;
    case 7: g=pot()+bush({flowers:1});break;
    case 8: g=pot()+bush({flowers:1,berries:1});break;
    case 9: g=pot()+tree(60,86,.62);break;
    case 10: g=pot()+tree(60,86,.78,{fruit:2});break;

    case 14: g=ground()+`<path d="M78 98v-10M86 98v-10M94 98v-10M102 98v-10M110 98v-10M76 91h36M76 95h36" stroke="#E7D3B0" stroke-width="2.4" stroke-linecap="round"/>`+tree(42,104,.95,{fruit:3})+`<circle cx="88" cy="98" r="9" fill="${C.m}"/><circle cx="98" cy="99" r="8" fill="${C.l}"/>`+flower(82,104,2.6)+flower(104,106,2.6)+flower(20,106,2.4);break;
    default: g=ground()+tree(28,104,.72,{fruit:2})+tree(94,104,.78,{blossom:1})+tree(60,106,1.02,{fruit:4,bird:1})+flower(14,108,2.4)+flower(108,108,2.4);
  }
  return `<svg viewBox="0 0 120 120" class="${cls||''}" aria-hidden="true">${g}</svg>`;
}
function totalChecks(){let n=0;for(const k in state.days){const c=state.days[k].checks;if(c) n+=Object.keys(c).length}return n}
function stageOf(n){let st=0;PLANT.forEach((p,i)=>{if(n>=p.at) st=i});return st}
function josaIGa(w){const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'이':'가')}
function plantName(){return (state.settings.plantName||'새싹이').slice(0,12)}
function plantInfo(){
  const n=totalChecks(),st=stageOf(n),nx=PLANT[st+1];
  const p=nx?(n-PLANT[st].at)/(nx.at-PLANT[st].at):1;
  const next=nx?`다음 단계 '${nx.n}'까지 체크 ${nx.at-n}개`:'마지막 단계까지 키웠어요';
  return {n,st,p,next};
}
function plantCard(){
  const pi=plantInfo(),cls=ui.grew?'grew':'';ui.grew=false;
  return `<button class="card plant" data-a="plant" aria-label="내 식물 ${esc(plantName())}, ${PLANT[pi.st].n} 단계">${plantSVG(pi.st,cls)}<span class="pi"><span class="pn">${esc(plantName())}</span> <span class="pst">${PLANT[pi.st].n}</span><span class="ps" style="display:block">지금까지 체크 ${pi.n}개 · ${pi.next}</span><span class="pbar" style="display:block"><i style="width:${Math.round(pi.p*100)}%"></i></span></span></button>`;
}
function plantSheet(){
  const pi=plantInfo();
  openSheet('내 식물',`<div class="pbig">${plantSVG(pi.st)}</div>
    <div class="fl"><label for="pl-name">식물 이름</label><input class="field" id="pl-name" value="${esc(plantName())}" maxlength="12" data-in="plant-name"></div>
    <span class="note">루틴을 체크할 때마다 물을 한 번 준 셈이에요. 지금까지 체크 ${pi.n}개 · ${pi.next}</span>
    <div class="pstages">${PLANT.map((p,i)=>`<div class="pstage ${i>pi.st?'lock':''} ${i===pi.st?'cur':''}">${plantSVG(i)}<b>${i+1}. ${p.n}</b><span>${i===0?'시작':`체크 ${p.at}개`}${i<=pi.st?' ✓':''}</span></div>`).join('')}</div>`);
}

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#37CF78','#F5BE36','#F25A50','#3B6FD8','#8A5CD0'];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*60,y:H*.3,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,s:5+Math.random()*5,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.35}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.33;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()});if(t-t0<2000) requestAnimationFrame(f);else c.remove()})(t0);
}

/* ---------- actions ---------- */
function setCheck(id,fn){
  const k=ui.sel,before=level(rateOf(k)),p0=stageOf(totalChecks());
  fn(day(k,true));snapshot(k);
  const p1=stageOf(totalChecks()),grew=p1>p0&&state.settings.plant!==false;
  if(grew) ui.grew=true;
  commit();
  const after=level(rateOf(k)),green=after==='go'&&before!=='go'&&k<=todayKey();
  if(green) confetti();
  if(grew) toast(`🌱 ${josaIGa(plantName())} '${PLANT[p1].n}' 단계로 자랐어요${green?' · 초록불도 켜졌어요':''}`);
  else if(green) toast('초록불이 켜졌어요! 오늘도 잘 해냈어요');
}
function swapIn(arr,item,dir,same){
  const i=arr.indexOf(item);let j=i+dir;
  while(j>=0&&j<arr.length&&!same(arr[j])) j+=dir;
  if(j<0||j>=arr.length) return false;
  [arr[i],arr[j]]=[arr[j],arr[i]];return true;
}
const A={

  'r-alt':id=>{const r=state.routines.find(x=>x.id===id);if(!r) return;const d=day(ui.sel,true);d.alt[id]=((d.alt[id]||0)+1)%(r.alts.length+1);commit();toast(`오늘은 ‘${routineName(r,ui.sel)}’로 해요`)},

  'r-up':id=>{const r=state.routines.find(x=>x.id===id);if(r&&swapIn(state.routines,r,-1,x=>x.modeId===r.modeId&&x.slot===r.slot)) commit()},
  'r-down':id=>{const r=state.routines.find(x=>x.id===id);if(r&&swapIn(state.routines,r,1,x=>x.modeId===r.modeId&&x.slot===r.slot)) commit()},
  'tpl':()=>templateSheet(),
  'tpl-add':id=>{
    const t=TEMPLATES[Number(id)];const picked=[...document.querySelectorAll(`input[name="tpl-${id}"]:checked`)].map(i=>t.items[Number(i.value)]);
    let n=0;picked.forEach(([name,emoji,slot])=>{if(state.routines.some(r=>r.modeId===state.activeMode&&r.name===name)) return;state.routines.push({id:uid(),modeId:state.activeMode,name,emoji,slot,days:[0,1,2,3,4,5,6],alts:[]});n++});
    state.flags.example=false;snapshot(todayKey());commit();toast(n?`루틴 ${n}개를 추가했어요`:'이미 있는 루틴이에요');
  },
  'clear-example':()=>{state.routines=[];state.todos=[];state.schedules=[];state.flags.example=false;snapshot(todayKey());commit();templateSheet()},
  'keep-example':()=>{state.flags.example=false;commit()},
  'drawer':id=>{ui.drawer=id==='1';ui.order=false;render()},
  'cat':id=>{ui.catFilter=id;render()},
  'cat-new':()=>catSheet(),
  'cat-del':(id,b)=>{if(!arm(b,'정말 삭제')) return;state.categories=state.categories.filter(c=>c.id!==id);state.todos.forEach(t=>{if(t.catId===id) t.catId=''});if(ui.catFilter===id) ui.catFilter='all';commit();catSheet()},
  'td-toggle':id=>{const t=state.todos.find(x=>x.id===id);if(t){t.done=!t.done;commit()}},
  'td-more':id=>todoSheet(id),
  'td-move':(id,b)=>{const t=state.todos.find(x=>x.id===id);if(!t) return;t.date=b.dataset.to||null;closeSheet();commit();toast(t.date?`${fmtShort(t.date)}로 옮겼어요`:'서랍에 넣었어요')},
  'td-del':(id,b)=>{if(!arm(b,'한 번 더 누르면 삭제')) return;state.todos=state.todos.filter(t=>t.id!==id);closeSheet();commit()},
  'td-up':id=>{const t=state.todos.find(x=>x.id===id);if(t&&swapIn(state.todos,t,-1,x=>x.date===t.date)) commit()},
  'td-down':id=>{const t=state.todos.find(x=>x.id===id);if(t&&swapIn(state.todos,t,1,x=>x.date===t.date)) commit()},
  'td-pull':()=>{const k=ui.sel;let n=0;state.todos.forEach(t=>{if(t.date&&t.date<k&&!t.done){t.date=k;n++}});commit();toast(`${n}개를 가져왔어요`)},
  'sc-new':()=>scheduleSheet(''),
  'sc-edit':id=>scheduleSheet(id),
  'sc-del':(id,b)=>{if(!arm(b,'한 번 더 누르면 삭제')) return;state.schedules=state.schedules.filter(s=>s.id!==id);closeSheet();commit()},
  'mood':id=>{const d=day(ui.sel,true),v=Number(id);d.mood=d.mood===v?null:v;commit()},
  'sv':id=>{ui.statView=id;render()},
  'sp':id=>{const n=Number(id);if(ui.statView==='week') ui.statAnchor=addDays(ui.statAnchor,7*n);else{const d=parseKey(ui.statAnchor);ui.statAnchor=keyOf(new Date(d.getFullYear(),d.getMonth()+n,1))}render()},
  'cal-go':id=>{ui.sel=id;ui.tab='today';render()},
  'green':id=>{state.settings.greenAt=Number(id);commit();settingsSheet()},
  'plant':()=>plantSheet(),
  'plant-toggle':()=>{state.settings.plant=state.settings.plant===false;commit();settingsSheet()},
  'skin':id=>{state.settings.skin=id;ui.order=false;commit();settingsSheet()},
  'dtb':()=>{state.settings.doneToBottom=!state.settings.doneToBottom;commit();settingsSheet()},
  'mode-del':(id,b)=>{const n=state.routines.filter(r=>r.modeId===id).length;if(!arm(b,n?`루틴 ${n}개와 함께 삭제`:'정말 삭제')) return;state.modes=state.modes.filter(m=>m.id!==id);state.routines=state.routines.filter(r=>r.modeId!==id);if(state.activeMode===id) state.activeMode=state.modes[0].id;commit();settingsSheet()},
  'vac-del':id=>{state.vacations.splice(Number(id),1);commit();settingsSheet()},
  'export':()=>{const txt=JSON.stringify(state);const ta=document.getElementById('imp');
    const done=()=>toast('백업을 복사했어요. 메모장 등에 붙여넣어 보관하세요');
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{ta.value=txt;ta.select();toast('자동 복사가 막혀 있어요. 아래 내용을 직접 복사하세요')})}else{ta.value=txt;ta.select();toast('아래 내용을 직접 복사하세요')}},
  'export-file':async()=>{
    const name=`harutin-backup-${todayKey()}.json`,blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'하루틴 백업'});state.flags.lastBackup=Date.now();commit({render:false});settingsSheet();return}}catch(e){if(e&&e.name==='AbortError') return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);state.flags.lastBackup=Date.now();commit({render:false});settingsSheet();toast('백업 파일을 저장했어요');
  },
  'import':()=>{const ta=document.getElementById('imp');let o=null;try{o=JSON.parse(ta.value)}catch(e){}
    if(!o||!Array.isArray(o.routines)){toast('백업 형식이 아니에요. 복사한 내용을 그대로 붙여넣어 주세요');return}
    state=migrate(o);applyChoice();commit();closeSheet();toast('백업을 불러왔어요')},
  'reset':(id,b)=>{if(!arm(b,'한 번 더 누르면 전부 지워져요')) return;state=seed();state.flags.example=true;commit();closeSheet();toast('처음 상태로 돌아갔어요')}

const F={
  'routine':f=>{
    const name=f.querySelector('#rf-name').value.trim();if(!name) return;
    const days=[...f.querySelectorAll('input[name="rf-day"]:checked')].map(i=>Number(i.value));

    const data={name,emoji:(f.querySelector('input[name="rf-icon"]:checked')||{}).value||'🌱',slot:(f.querySelector('input[name="rf-slot"]:checked')||{}).value||'anytime',days,
      alts:f.querySelector('#rf-alts').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,5),modeId:f.querySelector('#rf-mode').value,choice:f.querySelector('#rf-choice').value.trim()||undefined};

  },
  'todo-add':f=>{const i=f.querySelector('#td-title'),v=i.value.trim();if(!v) return;state.todos.push({id:uid(),title:v,date:ui.drawer?null:ui.sel,catId:f.querySelector('#td-cat').value,done:false});commit();const n=document.getElementById('td-title');if(n) n.focus()},

  'schedule':f=>{
    const st=f.querySelector('#sf-start').value,en=f.querySelector('#sf-end').value;

};
let jTimer;
const I={
  'weight':el=>{const d=day(ui.sel,true);d.weight=el.value===''?null:Number(el.value);savedNote()},

function savedNote(){commit({render:false});const n=document.getElementById('j-saved');if(n){n.textContent='저장됐어요';clearTimeout(jTimer);jTimer=setTimeout(()=>{n.textContent='입력하면 바로 저장돼요.'},1500)}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b) return;
  const fn=A[b.dataset.a];if(!fn) return;
  if(b.tagName==='BUTTON'&&b.type!=='submit') e.preventDefault();
  fn(b.dataset.id,b,e);
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f) return;e.preventDefault();const fn=F[f.dataset.f];if(fn) fn(f)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el) return;const fn=I[el.dataset.in];if(fn) fn(el)});

    state=migrate(o);applyChoice();commit();closeSheet();toast('백업을 불러왔어요')});

document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet()});
function fromHash(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)) ui.tab=h}
window.addEventListener('hashchange',()=>{fromHash();render()});

/* boot */

fromHash();
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
setInterval(()=>{if(ui.tab==='schedule'&&!document.getElementById('sheet-root')) render()},60000);
})();
